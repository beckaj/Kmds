<!DOCTYPE html>
<html>
<head>
  <title>Debug - Current System State</title>
  <style>
    body {
      font-family: 'Poppins', sans-serif;
      padding: 20px;
      background: #1f3a5f;
    }
    .container {
      max-width: 1400px;
      margin: 0 auto;
      background: white;
      border-radius: 12px;
      padding: 30px;
      box-shadow: 0 10px 40px rgba(0,0,0,0.3);
    }
    h1 {
      color: #1f3a5f;
      border-bottom: 3px solid #f9a825;
      padding-bottom: 10px;
    }
    h2 {
      color: #1f3a5f;
      margin-top: 30px;
      background: #f8f9fa;
      padding: 10px 15px;
      border-radius: 8px;
    }
    button {
      background: #1f3a5f;
      color: white;
      border: none;
      padding: 12px 24px;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
      margin: 5px;
      font-size: 14px;
    }
    button:hover {
      background: #27548a;
    }
    .loading {
      color: #f9a825;
      font-size: 18px;
      font-weight: 600;
    }
    .section {
      background: #f8f9fa;
      padding: 15px;
      border-radius: 8px;
      margin: 15px 0;
      border-left: 4px solid #1f3a5f;
    }
    pre {
      background: #263238;
      color: #aed581;
      padding: 15px;
      border-radius: 8px;
      overflow-x: auto;
      font-size: 12px;
      line-height: 1.5;
    }
    .badge {
      display: inline-block;
      padding: 4px 12px;
      border-radius: 12px;
      font-size: 12px;
      font-weight: 600;
      margin: 0 5px;
    }
    .badge-green { background: #d4edda; color: #155724; }
    .badge-blue { background: #d1ecf1; color: #0c5460; }
    .badge-yellow { background: #fff3cd; color: #856404; }
    .badge-red { background: #f8d7da; color: #721c24; }
    table {
      width: 100%;
      border-collapse: collapse;
      margin: 15px 0;
    }
    th, td {
      padding: 12px;
      text-align: left;
      border-bottom: 1px solid #dee2e6;
    }
    th {
      background: #1f3a5f;
      color: white;
      font-weight: 600;
    }
    tr:hover {
      background: #f8f9fa;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>🔍 System State Debugger</h1>
    
    <div>
      <button onclick="loadAllData()">🔄 Refresh All Data</button>
      <button onclick="checkQueues()">📋 Check Queues Only</button>
      <button onclick="clearAll()">🗑️ Clear Results</button>
    </div>
    
    <div id="loading" class="loading" style="display:none; margin: 20px 0;">
      ⏳ Loading data...
    </div>
    
    <div id="results"></div>
  </div>
  
  <script>
    const projectId = "rkdrchffswbqiszdbuui";
    const publicAnonKey = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJrZHJjaGZmc3dicWlzemRidXVpIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzAzNzMxMzEsImV4cCI6MjA4NTk0OTEzMX0.gkK7REbUajJ2oJ-IdFbO8Ao2Vv9ENJkXW2mc2L3wswg";
    
    async function apiCall(endpoint) {
      const response = await fetch(
        `https://${projectId}.supabase.co/functions/v1/make-server-698be164${endpoint}`,
        {
          headers: {
            'Authorization': `Bearer ${publicAnonKey}`,
          },
        }
      );
      return await response.json();
    }
    
    function clearAll() {
      document.getElementById('results').innerHTML = '';
    }
    
    async function checkQueues() {
      document.getElementById('loading').style.display = 'block';
      
      try {
        const data = await apiCall('/debug/queues');
        
        let html = '<h2>📊 Queue Status</h2>';
        
        if (data.success) {
          html += '<div class="section">';
          html += '<table>';
          html += '<thead><tr><th>Queue</th><th>Count</th><th>Application IDs</th></tr></thead>';
          html += '<tbody>';
          
          const queues = [
            { name: 'Caseworker', key: 'caseworker' },
            { name: 'Revenue Officer', key: 'revenueOfficer' },
            { name: 'Field Engineer', key: 'fieldEngineer' },
            { name: 'Commissioner', key: 'commissioner' },
          ];
          
          queues.forEach(queue => {
            const queueData = data.queues[queue.key] || [];
            const count = queueData.length;
            const ids = queueData.join(', ') || 'Empty';
            html += `<tr>
              <td><strong>${queue.name}</strong></td>
              <td><span class="badge ${count > 0 ? 'badge-green' : 'badge-yellow'}">${count}</span></td>
              <td style="font-size: 11px; font-family: monospace;">${ids}</td>
            </tr>`;
          });
          
          html += '</tbody></table>';
          html += '</div>';
          
          // Applications summary
          html += '<h2>📄 Applications Summary</h2>';
          html += '<div class="section">';
          html += `<p><strong>Total Applications:</strong> <span class="badge badge-blue">${data.applications?.length || 0}</span></p>`;
          
          if (data.applications && data.applications.length > 0) {
            html += '<table>';
            html += '<thead><tr><th>ID</th><th>Status</th><th>Current Stage</th></tr></thead>';
            html += '<tbody>';
            data.applications.forEach(app => {
              html += `<tr>
                <td style="font-family: monospace; font-size: 11px;">${app.id}</td>
                <td><span class="badge badge-yellow">${app.status || 'N/A'}</span></td>
                <td>${app.currentStage || 'N/A'}</td>
              </tr>`;
            });
            html += '</tbody></table>';
          }
          html += '</div>';
          
        } else {
          html += `<div class="section"><pre>${JSON.stringify(data, null, 2)}</pre></div>`;
        }
        
        document.getElementById('results').innerHTML = html;
        
      } catch (error) {
        document.getElementById('results').innerHTML = 
          `<div class="section"><h3 style="color: #dc3545;">Error</h3><pre>${error}</pre></div>`;
      } finally {
        document.getElementById('loading').style.display = 'none';
      }
    }
    
    async function loadAllData() {
      document.getElementById('loading').style.display = 'block';
      clearAll();
      
      try {
        // Check queues first
        await checkQueues();
        
      } catch (error) {
        document.getElementById('results').innerHTML = 
          `<div class="section"><h3 style="color: #dc3545;">Error</h3><pre>${error}</pre></div>`;
      } finally {
        document.getElementById('loading').style.display = 'none';
      }
    }
    
    // Auto-load on page open
    window.addEventListener('load', () => {
      loadAllData();
    });
  </script>
</body>
</html>
